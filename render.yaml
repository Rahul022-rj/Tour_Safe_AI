# Render Blueprint: deploys TourSafe AI as ONE web service (API + website + embedded demo blockchain).
# Render reads this file when you choose "New → Blueprint" and select this GitHub repository.
# Values marked "sync: false" are asked for in the Render dashboard (they are secrets: never commit them).
services:
  - type: web
    name: toursafe-ai
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Login token secret, generated by Render
      - key: JWT_SECRET
        generateValue: true
      # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster0.xxxx.mongodb.net/tourist_safety
      - key: MONGODB_URI
        sync: false
      # First operator (control room) login, created automatically on the first start
      - key: SETUP_ADMIN_EMAIL
        sync: false
      - key: SETUP_ADMIN_PASSWORD
        sync: false
      - key: SETUP_ADMIN_NAME
        value: Control Room
      # Create zones / sample stations / operator automatically (only what is missing)
      - key: AUTO_SETUP
        value: "true"
      # Demo blockchain inside the server (rebuilt from the database on every restart)
      - key: EMBEDDED_CHAIN
        value: "true"
      # Render puts a proxy in front of the app: needed for correct client IPs in rate limiting
      - key: TRUST_PROXY
        value: "true"
      # Free instances have little CPU; 10 rounds is still a strong bcrypt cost
      - key: BCRYPT_ROUNDS
        value: "10"
      # Optional: email and SMS providers (add in the dashboard if you have them)
      # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, EMAIL_FROM, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM_NUMBER
